name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  docs-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify core docs present and non-empty
        run: |
          test -s README.md
          test -s PROVENANCE.md
          test -s SECURITY.md
          echo "docs-smoke ok: README/PROVENANCE/SECURITY present"
